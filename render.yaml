services:
  - type: web
    name: elderlink
    runtime: docker
    region: oregon
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    disk:
      name: elderlink-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: DB_URL
        value: jdbc:h2:file:/app/data/elderlink;DB_CLOSE_ON_EXIT=FALSE
      - key: DB_USERNAME
        value: sa
      - key: JWT_SECRET
        generateValue: true